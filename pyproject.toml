[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed"
version = "0.1.0"
description = "FedMed cross-silo federated learning engine for privacy-preserving MRI tumor segmentation"
requires-python = ">=3.10"
dependencies = [
    "flwr>=1.13",
    "torch>=2.2",
    "torchvision>=0.17",
    "monai>=1.3",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["cv_model", "hospital_nodes", "server"]

[tool.flwr.app]
publisher = "fedmed"

[tool.flwr.app.components]
serverapp = "server.server_app:app"
clientapp = "hospital_nodes.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-epochs = 1
local-val-fraction = 0.0


